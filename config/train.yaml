model:
  name: afrcnn
  # Output sources are derived from data.dataset.
  encoder_channels: 512
  kernel_size: 21
  stride: 10
  bottleneck_channels: 512
  hidden_channels: 512
  stages: 5
  iterations: 16
data:
  dataset: libri2mix  # Change to libri3mix for a separate three-speaker run.
  roots:
    libri2mix: data/Libri2Mix-5000
    libri3mix: data/Libri3Mix-5000
  train_manifest: train.json
  validation_manifest: validation.json
  test_manifest: test.json
  sample_rate: 8000
  segment_seconds: 3
  fixed_crops: true
  dynamic_mixing:
    enabled: true
    source_rms: 0.05
    gain_db: [-5.0, 5.0]
    peak_limit: 0.9
    crop_attempts: 10
training:
  seed: 42
  device: auto
  amp: true
  batch_size: 8
  accumulation_steps: 1
  workers: 2
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0
  gradient_clip: 5.0
  scale_loss_weight: 1.0
  scheduler_patience: 3
  scheduler_factor: 0.5
  early_stopping_patience: 10
  log_every_steps: 20
checkpoint:
  resume: null
logging:
  wandb_mode: online
  wandb_project: libri3mix-separation
  wandb_entity: null
